name: grad_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  flutter_tts: ^3.8.5
  speech_to_text: ^7.3.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  intl: ^0.20.2
  connectivity_plus: ^6.0.0
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  permission_handler: ^12.0.1
  firebase_messaging: ^16.1.2   # ← updated from 15.2.5
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  # I updated this to 5.0.0 to match the 3.10.0 SDK environment
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon2.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/images/icon2.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/